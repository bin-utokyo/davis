[project]
name = "davis-cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.43.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "weasyprint>=69.0",
    "jinja2>=3.1.6",
    "charset-normalizer>=3.4.9",
    "dvc[gdrive]>=3.67.1",
    # dvc-gdrive does not constrain PyDrive2 tightly enough. Without this,
    # resolvers may select PyDrive2 1.21.2 with cryptography 49, which fails
    # at runtime while importing OpenSSL (`lib.GEN_EMAIL`). PyDrive2 1.21.3
    # declares the compatible cryptography/PyOpenSSL bounds.
    "pydrive2>=1.21.3",
]

[project.scripts]
davis = "dataset_cli.main:app"

[tool.uv]
package = true

[dependency-groups]
dev = ["types-pyyaml>=6.0.12.20260518"]

[tool.setuptools.package-data]
dataset_cli = [
    "locales/**/LC_MESSAGES/*.mo",
    "locales/**/LC_MESSAGES/*.po",
    "templates/*",
]
