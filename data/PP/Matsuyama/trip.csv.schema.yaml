description:
  en: This dataset contains PP (Probe Person) data collected in Matsuyama City in
    2007, comprising 7,810 trips gathered between February 19 and March 23, 2007.
  ja: 2007年に松山市で収集されたPP（プローブパーソン）データ 1,253,114件の位置情報レコード 2007年2月19日~3月23日
