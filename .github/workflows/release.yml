name: Release Davis CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-unix:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: davis-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            asset: davis-linux-aarch64.tar.gz
          - runner: macos-15-intel
            asset: davis-macos-x86_64.tar.gz
          - runner: macos-15
            asset: davis-macos-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build --release --locked --package davis-cli
      - name: Verify binary
        run: target/release/davis --version
      - name: Package binary
        run: tar -C target/release -czf "${{ matrix.asset }}" davis
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  build-windows:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            asset: davis-windows-x86_64.zip
          - runner: windows-11-arm
            asset: davis-windows-aarch64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI with a static C runtime
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --package davis-cli
      - name: Verify binary
        shell: pwsh
        run: .\target\release\davis.exe --version
      - name: Package binary
        shell: pwsh
        run: Compress-Archive -Path .\target\release\davis.exe -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  build-components:
    name: Build and verify official components
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build component tooling
        run: cargo build --release --locked --package davis-cli
      - name: Package official components and generate registry
        shell: bash
        run: |
          mkdir -p dist
          target/release/davis component pack components/davis-mnl --name mnl --out dist
          target/release/davis component pack \
            components/davis-csv-transform \
            --name csv-transform \
            --out dist
          target/release/davis component registry \
            dist/davis-mnl-0.2.0.entry.json \
            dist/davis-csv-transform-0.3.0.entry.json \
            --out dist/component-registry.json
      - name: Verify transform-to-model execution through the registry
        shell: bash
        env:
          DAVIS_DISABLE_UPDATE_CHECK: "1"
        run: |
          python3 -m http.server 8765 --directory dist >component-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8765/component-registry.json >/dev/null && break
            sleep 1
          done
          test_root=$(mktemp -d)
          export DAVIS_DATA_HOME="$test_root/user-data"
          target/release/davis install component mnl \
            --registry http://127.0.0.1:8765/component-registry.json
          target/release/davis install component csv-transform \
            --registry http://127.0.0.1:8765/component-registry.json
          mkdir -p "$test_root/project"
          cp components/davis-csv-transform/examples/mnl-chain/choice.csv \
            "$test_root/project/choice.csv"
          cp components/davis-csv-transform/examples/mnl-chain/transform.yaml \
            "$test_root/project/transform.yaml"
          target/release/davis --repository "$test_root/project" model run \
            "$test_root/project/transform.yaml" \
            --run-root "$test_root/project/davis-runs" \
            --json > "$test_root/transform-run.json"
          transform_run_id=$(jq -r '.request.run_id' "$test_root/transform-run.json")
          sed "s/REPLACE_WITH_TRANSFORM_RUN_ID/$transform_run_id/" \
            components/davis-csv-transform/examples/mnl-chain/mnl-from-run.template.yaml \
            > "$test_root/project/model.yaml"
          target/release/davis --repository "$test_root/project" model run \
            "$test_root/project/model.yaml" \
            --run-root "$test_root/project/davis-runs"
          test -f "$test_root/project/davis-runs"/*/artifacts/parameters.csv
      - uses: actions/upload-artifact@v4
        with:
          name: official-components
          path: |
            dist/davis-mnl-0.2.0.tar.gz
            dist/davis-csv-transform-0.3.0.tar.gz
            dist/component-registry.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-unix, build-windows, build-components]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Verify tag and package versions
        shell: bash
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "davis-cli") | .version')
          release_version=$(jq -r '.latest' release/latest-version.json)
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version"
          test "$release_version" = "$tag_version"
      - name: Create checksums and include installers
        shell: bash
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cp release/latest-version.json dist/
          cd dist
          sha256sum davis-* component-registry.json latest-version.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
