[workspace]
members = [
    "crates/davis-core",
    "crates/davis-catalog",
    "crates/davis-document",
    "crates/davis-cli",
    "crates/davis-storage",
]
resolver = "2"

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/bin-utokyo/davis"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
fullbleed = "2.3.1"
futures = "0.3"
indicatif = "0.18"
opendal = { version = "0.58", default-features = false, features = ["http-transport-reqwest", "services-fs", "services-s3"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
toml = "0.9"
url = "2"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
