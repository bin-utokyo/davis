api_version: davis.component/v1
id: davis/nl
name: Davis Nested Logit
version: 0.1.0
kind: model
requires_davis: '>=0.5.0'
runtime:
  executor: process
  command:
  - uv
  - run
  - --frozen
  - python
  - -m
  - davis_nl
  request_argument: --request
  lockfile: uv.lock
  requirements:
  - command: uv
    version: '>=0.8'
    install:
      macos: https://docs.astral.sh/uv/getting-started/installation/
      windows: https://docs.astral.sh/uv/getting-started/installation/
      linux: https://docs.astral.sh/uv/getting-started/installation/
operations:
- validate
- estimate
inputs:
- name: choice_data
  media_types: [text/csv, application/vnd.apache.parquet]
  required: true
configuration:
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: Davis Nested Logit configuration
    additionalProperties: false
    type: object
    required: [roles, terms, nests]
    properties:
      roles:
        type: object
        additionalProperties: false
        required: [case_id, alternative_id, chosen]
        properties:
          case_id: {type: string}
          alternative_id: {type: string}
          chosen: {type: string}
          available: {type: string}
      terms:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [parameter]
          properties:
            parameter: {type: string}
            column: {type: string}
            constant: {type: number}
            alternatives:
              type: array
              items: {type: [string, number]}
          oneOf:
          - required: [column]
          - required: [constant]
      nests:
        type: array
        minItems: 2
        items:
          type: object
          additionalProperties: false
          required: [name, alternatives]
          properties:
            name: {type: string, minLength: 1}
            alternatives:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: [string, number]}
            dissimilarity:
              type: object
              title: 非類似度 λ
              description: このcomponentでは最上位scaleを1に正規化し，各nestの非類似度λを0より大きく1以下で指定します．
              x-davis-title: {ja: 非類似度 λ, en: Dissimilarity λ}
              x-davis-description: {ja: このcomponentでは最上位scaleを1に正規化し，各nestの非類似度λを0より大きく1以下で指定します．, en: This component normalizes the top-level scale to 1 and requires each nest dissimilarity λ to be greater than 0 and no greater than 1.}
              additionalProperties: false
              properties:
                initial: {type: number, title: 推定初期値, x-davis-title: {ja: 推定初期値, en: Initial estimate}, exclusiveMinimum: 0, maximum: 1}
                fixed: {type: number, title: 固定値, x-davis-title: {ja: 固定値, en: Fixed value}, exclusiveMinimum: 0, maximum: 1}
      estimation:
        type: object
        additionalProperties: false
        properties:
          max_iterations: {type: integer, minimum: 1}
          tolerance: {type: number, exclusiveMinimum: 0}
presentation:
  ui:
    version: davis.ui/v1
    component_name: {ja: Davisネステッドロジット, en: Davis Nested Logit}
    ui:description: {ja: 線形効用termと選択肢のnest分割を設定します．, en: Define linear utility terms and a partition of alternatives into nests.}
    extensions:
      - id: nest-editor
        api_version: davis.widget/v1
        source: ui/nest-editor.html
    inputs:
      choice_data:
        title: {ja: 選択データ, en: Choice data}
        description: {ja: 1行が1ケース内の1選択肢を表すlong形式の表です．複数CSVを結合できます．, en: A long-format table where each row represents one alternative in one choice case. Multiple CSV files can be joined.}
        widget: table-binding
        preparation: {component: davis/csv-transform, version: 0.4.0}
    sections:
      - bind: /roles
        widget: column-map
        input: choice_data
        title: {ja: 役割列, en: Role columns}
        labels:
          case_id: {ja: ケースID, en: Case ID}
          alternative_id: {ja: 選択肢ID, en: Alternative ID}
          chosen: {ja: 選択結果, en: Choice outcome}
          available: {ja: 利用可能性 (任意), en: Availability (optional)}
      - bind: /terms
        widget: utility-terms
        input: choice_data
        title: {ja: 効用term, en: Utility terms}
        allow_constant: true
        alternatives_from: /roles/alternative_id
      - bind: /nests
        widget: extension:nest-editor
        title: {ja: Nest構造と非類似度 λ, en: Nest structure and dissimilarity λ}
        description: {ja: 最上位scaleは1に正規化済みです．推定時の数値は結果ではなく初期値です．選択肢が1つだけのnestは実行時にλ=1へ固定されます．, en: The top-level scale is normalized to 1. An estimated value is an initial value rather than a result. A singleton nest is fixed to λ=1 at runtime.}
        context:
          alternatives:
            provider: distinct-values
            input: choice_data
            column_from: /roles/alternative_id
        labels:
          mode: {ja: 非類似度λの扱い, en: Dissimilarity λ mode}
          estimate: {ja: 推定 (右は初期値), en: Estimate (initial value at right)}
          fixed: {ja: 固定 (右は固定値), en: Fixed (fixed value at right)}
          estimate_value: {ja: 非類似度λの推定初期値, en: Initial value for dissimilarity λ}
          fixed_value: {ja: 非類似度λの固定値, en: Fixed dissimilarity λ}
          add: {ja: Nestを追加, en: Add nest}
          empty: {ja: 2つ以上のNestを追加してください．, en: Add at least two nests.}
          search: {ja: 選択肢を検索, en: Search alternatives}
          select_source: {ja: 候補列を先に指定, en: Select the source column first}
          remove: {ja: 削除, en: Remove}
      - bind: /estimation
        widget: auto
        title: {ja: 推定設定, en: Estimation settings}
    defaults:
      estimation: {max_iterations: 500, tolerance: 1.0e-8}
    results:
    - {artifact: metrics, title: {ja: 推定指標, en: Estimation metrics}, widget: key-value}
    - {artifact: parameters, title: {ja: 推定係数・非類似度, en: Parameters and dissimilarities}, widget: table}
    - {artifact: predictions, title: {ja: 予測確率, en: Predicted probabilities}, widget: table}
outputs:
  artifacts:
    parameters: {profile: parameters, media_types: [text/csv], required: false}
    metrics: {profile: metrics, media_types: [application/json], required: false}
    predictions: {profile: predictions, media_types: [text/csv], required: false}
    sample_summary: {profile: diagnostics, media_types: [application/json], required: true}
