[project]
name = "davis-csv-transform"
version = "0.4.0"
description = "Reference CSV feature transformation component for Davis"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/davis_csv_transform"]
