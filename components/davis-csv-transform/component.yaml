---
api_version: davis.component/v1
id: davis/csv-transform
name: Davis CSV Transform
version: 0.4.0
kind: transform
requires_davis: ">=0.4.0"
runtime:
  executor: process
  command:
  - uv
  - run
  - "--frozen"
  - python
  - "-m"
  - davis_csv_transform
  request_argument: "--request"
  lockfile: uv.lock
  requirements:
  - command: uv
    version: ">=0.8"
    install:
      macos: https://docs.astral.sh/uv/getting-started/installation/
      windows: https://docs.astral.sh/uv/getting-started/installation/
      linux: https://docs.astral.sh/uv/getting-started/installation/
operations:
- transform
inputs:
- name: table
  media_types:
  - text/csv
  required: true
additional_inputs:
  media_types:
  - text/csv
outputs:
  artifacts:
    transformed_table:
      media_types:
      - text/csv
      - application/vnd.apache.parquet
      required: true
    transformation_summary:
      media_types:
      - application/json
      required: true
configuration:
  schema:
    "$schema": https://json-schema.org/draft/2020-12/schema
    "$id": https://davis.example/schemas/csv-transform-config-v1alpha1.json
    title: Davis CSV transformation configuration
    type: object
    additionalProperties: false
    properties:
      output:
        type: object
        additionalProperties: false
        properties:
          format:
            enum:
            - csv
            - parquet
            default: csv
          compression:
            enum:
            - zstd
            - snappy
            - gzip
            - none
            default: zstd
          null_values:
            type: array
            uniqueItems: true
            items:
              type: string
            default: []
          column_types:
            type: object
            propertyNames:
              minLength: 1
            additionalProperties:
              enum:
              - string
              - int64
              - float64
              - boolean
            default: {}
      select:
        type: object
        additionalProperties: false
        required:
        - columns
        properties:
          columns:
            type: object
            description: Map final output column names to current transformed columns.
            minProperties: 1
            propertyNames:
              minLength: 1
            additionalProperties:
              type: string
              minLength: 1
      joins:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - input
          - left_on
          - right_on
          - columns
          properties:
            input:
              type: string
              minLength: 1
              not:
                const: table
            how:
              enum:
              - left
              - inner
              default: left
            relationship:
              enum:
              - many_to_one
              - one_to_one
              default: many_to_one
            allow_unmatched:
              type: boolean
              default: false
            left_on:
              "$ref": "#/$defs/keyColumns"
            right_on:
              "$ref": "#/$defs/keyColumns"
            columns:
              type: object
              description: Map output column names to source columns in the join input.
              minProperties: 1
              additionalProperties:
                type: string
                minLength: 1
              propertyNames:
                minLength: 1
      calculations:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - output
          - operation
          - terms
          properties:
            output:
              type: string
              minLength: 1
            operation:
              const: linear_combination
            replace:
              type: boolean
              default: false
            terms:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                properties:
                  column:
                    type: string
                    minLength: 1
                  constant:
                    type: number
                  coefficient:
                    type: number
                    default: 1.0
                oneOf:
                - required:
                  - column
                - required:
                  - constant
    anyOf:
    - required:
      - joins
    - required:
      - calculations
    - required:
      - select
    "$defs":
      keyColumns:
        oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
presentation:
  ui:
    ui:order:
    - output
    - joins
    - calculations
    - select
    output:
      ui:description: Write a human-readable CSV or a typed, compressed Parquet artifact.
        CSV is the default.
    joins:
      ui:description: Join additional CSV inputs by one or more exact key columns.
        Duplicate and unmatched keys are checked explicitly.
    calculations:
      ui:description: Create reproducible numeric columns without embedding arbitrary
        code in YAML.
    select:
      ui:description: Select and rename the final columns after joins and calculations.
