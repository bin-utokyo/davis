---
api_version: davis.component/v1
id: davis/csv-transform
name: Davis CSV Transform
version: 0.4.1
kind: transform
requires_davis: ">=0.4.0"
runtime:
  executor: process
  command:
  - uv
  - run
  - "--frozen"
  - python
  - "-m"
  - davis_csv_transform
  request_argument: "--request"
  lockfile: uv.lock
  requirements:
  - command: uv
    version: ">=0.8"
    install:
      macos: https://docs.astral.sh/uv/getting-started/installation/
      windows: https://docs.astral.sh/uv/getting-started/installation/
      linux: https://docs.astral.sh/uv/getting-started/installation/
operations:
- transform
inputs:
- name: table
  media_types:
  - text/csv
  required: true
additional_inputs:
  media_types:
  - text/csv
outputs:
  artifacts:
    transformed_table:
      profile: table
      media_types:
      - text/csv
      - application/vnd.apache.parquet
      required: true
    transformation_summary:
      profile: metrics
      media_types:
      - application/json
      required: true
configuration:
  schema:
    "$schema": https://json-schema.org/draft/2020-12/schema
    "$id": https://davis.example/schemas/csv-transform-config-v1alpha1.json
    title: Davis CSV transformation configuration
    type: object
    additionalProperties: false
    properties:
      output:
        type: object
        additionalProperties: false
        properties:
          format:
            enum:
            - csv
            - parquet
            default: csv
          compression:
            enum:
            - zstd
            - snappy
            - gzip
            - none
            default: zstd
          null_values:
            type: array
            uniqueItems: true
            items:
              type: string
            default: []
          column_types:
            type: object
            propertyNames:
              minLength: 1
            additionalProperties:
              enum:
              - string
              - int64
              - float64
              - boolean
            default: {}
      select:
        type: object
        additionalProperties: false
        required:
        - columns
        properties:
          columns:
            type: object
            description: Map final output column names to current transformed columns.
            minProperties: 1
            propertyNames:
              minLength: 1
            additionalProperties:
              type: string
              minLength: 1
      joins:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - input
          - left_on
          - right_on
          - columns
          properties:
            input:
              type: string
              minLength: 1
              not:
                const: table
            how:
              enum:
              - left
              - inner
              default: left
            relationship:
              enum:
              - many_to_one
              - one_to_one
              default: many_to_one
            allow_unmatched:
              type: boolean
              default: false
            left_on:
              "$ref": "#/$defs/keyColumns"
            right_on:
              "$ref": "#/$defs/keyColumns"
            columns:
              type: object
              description: Map output column names to source columns in the join input.
              minProperties: 1
              additionalProperties:
                type: string
                minLength: 1
              propertyNames:
                minLength: 1
      calculations:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - output
          - operation
          - terms
          properties:
            output:
              type: string
              minLength: 1
            operation:
              const: linear_combination
            replace:
              type: boolean
              default: false
            terms:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                properties:
                  column:
                    type: string
                    minLength: 1
                  constant:
                    type: number
                  coefficient:
                    type: number
                    default: 1.0
                oneOf:
                - required:
                  - column
                - required:
                  - constant
    anyOf:
    - required:
      - joins
    - required:
      - calculations
    - required:
      - select
    "$defs":
      keyColumns:
        oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
presentation:
  ui:
    version: davis.ui/v1
    component_name: {ja: Davis CSV変換, en: Davis CSV Transform}
    inputs:
      table:
        title: {ja: 入力表, en: Input table}
        description: {ja: 変換する基準CSVです．複数CSVを選ぶ場合はDavis共通のtable bindingで先に結合します．, en: "The base CSV to transform. When selecting multiple CSV files, Davis first joins them through the shared table binding."}
        widget: table-binding
    sections:
    - bind: /output
      widget: auto
      title: {ja: 出力設定, en: Output settings}
      description: {ja: CSVまたは型付き圧縮Parquetとして出力します．, en: Write CSV or typed, compressed Parquet output.}
    - bind: /joins
      widget: auto
      title: {ja: 追加結合設定, en: Additional join settings}
      description: {ja: 高度な追加input結合をYAMLで設定します．通常の複数CSV結合は上の入力欄で設定できます．, en: "Configure advanced additional-input joins in YAML. Use the input area above for ordinary multi-CSV joins."}
    - bind: /calculations
      widget: auto
      title: {ja: 列計算, en: Column calculations}
      description: {ja: 任意codeを埋め込まず，再現可能な数値列を作成します．, en: "Create reproducible numeric columns without embedding arbitrary code."}
    - bind: /select
      widget: auto
      title: {ja: 出力列, en: Output columns}
      description: {ja: 結合・計算後に残す列と出力列名を指定します．, en: "Select and rename columns after joins and calculations."}
    defaults:
      output: {format: csv, compression: zstd, null_values: [], column_types: {}}
    results:
    - {artifact: transformation_summary, title: {ja: 変換概要, en: Transformation summary}, widget: key-value}
    - {artifact: transformed_table, title: {ja: 変換結果, en: Transformed table}, widget: table}
