api_version: davis.analysis/v1alpha1
name: minimal-feature-transform

component:
  id: davis/csv-transform
  version: 0.3.0
  operation: transform

inputs:
  table:
    kind: local
    path: input.csv

config:
  calculations:
    - output: generalized_cost
      operation: linear_combination
      terms:
        - column: time
        - column: cost
          coefficient: 2
        - constant: 1

run:
  label: minimal-transform-example
  tags: [example, transform]
