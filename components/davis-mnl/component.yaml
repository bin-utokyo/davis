---
api_version: davis.component/v1
id: davis/mnl
name: Davis Multinomial Logit
version: 0.3.0
kind: model
requires_davis: ">=0.5.0"
runtime:
  executor: process
  command:
  - uv
  - run
  - "--frozen"
  - python
  - "-m"
  - davis_mnl
  request_argument: "--request"
  lockfile: uv.lock
  requirements:
  - command: uv
    version: ">=0.8"
    install:
      macos: https://docs.astral.sh/uv/getting-started/installation/
      windows: https://docs.astral.sh/uv/getting-started/installation/
      linux: https://docs.astral.sh/uv/getting-started/installation/
operations:
- validate
- estimate
inputs:
- name: choice_data
  media_types:
  - text/csv
  - application/vnd.apache.parquet
  required: true
outputs:
  artifacts:
    parameters:
      media_types:
      - text/csv
      required: false
    covariance:
      media_types:
      - text/csv
      required: false
    metrics:
      media_types:
      - application/json
      required: false
    predictions:
      media_types:
      - text/csv
      required: false
    sample_summary:
      media_types:
      - application/json
      required: true
  extensions: []
configuration:
  schema:
    "$schema": https://json-schema.org/draft/2020-12/schema
    "$id": https://davis.example/schemas/mnl-config-v1alpha1.json
    title: Davis MNL configuration
    type: object
    additionalProperties: false
    required:
    - roles
    - terms
    properties:
      roles:
        type: object
        additionalProperties: false
        required:
        - case_id
        - alternative_id
        oneOf:
        - required:
          - chosen
        - required:
          - chosen_alternative
        properties:
          case_id:
            oneOf:
            - type: string
            - type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
          alternative_id:
            type: string
          chosen:
            type: string
          chosen_alternative:
            type: string
          available:
            type: string
          weight:
            type: string
      terms:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - parameter
          properties:
            parameter:
              type: string
            column:
              type: string
            constant:
              type: number
            alternatives:
              type: array
              items:
                type:
                - string
                - number
          oneOf:
          - required:
            - column
          - required:
            - constant
      parameters:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            initial:
              type: number
      estimation:
        type: object
        additionalProperties: false
        properties:
          optimizer:
            enum:
            - bfgs
            - l-bfgs-b
          max_iterations:
            type: integer
            minimum: 1
          tolerance:
            type: number
            exclusiveMinimum: 0
          development_case_limit:
            type: integer
            minimum: 1
            description: 入力順の先頭Nケースだけを使う動作確認用設定です．本推定では省略してください．
presentation:
  ui:
    version: davis.ui/v1
    inputs:
      choice_data:
        title: 選択データ
        description: 1行が1ケース内の1選択肢を表すlong形式の表です．複数CSVを結合できます．
        widget: table-binding
        preparation: {component: davis/csv-transform, version: 0.4.0}
    sections:
    - bind: /roles
      widget: column-map
      input: choice_data
      title: 役割列
      labels:
        case_id: ケースキー
        alternative_id: 選択肢ID
        chosen: 選択済みフラグ
        chosen_alternative: 選択された選択肢ID
        available: 利用可能性 (任意)
        weight: 重み (任意)
    - bind: /terms
      widget: utility-terms
      input: choice_data
      title: 効用term
      allow_constant: true
      alternatives_from: /roles/alternative_id
    - {bind: /parameters, widget: parameter-settings, parameters_from: /terms, title: Parameter設定}
    - {bind: /estimation, widget: auto, title: 推定設定}
    defaults:
      estimation: {optimizer: bfgs, max_iterations: 500, tolerance: 1.0e-8}
    results:
    - artifact: metrics
      title: 推定指標
      widget: key-value
    - artifact: parameters
      title: 推定係数
      widget: table
    - artifact: sample_summary
      title: 標本
      widget: key-value
    - artifact: predictions
      title: 予測確率
      widget: table
