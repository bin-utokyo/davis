---
api_version: davis.component/v1
id: davis/mnl
name: Davis Multinomial Logit
version: 0.3.0
kind: model
requires_davis: ">=0.5.0"
runtime:
  executor: process
  command:
  - uv
  - run
  - "--frozen"
  - python
  - "-m"
  - davis_mnl
  request_argument: "--request"
  lockfile: uv.lock
  requirements:
  - command: uv
    version: ">=0.8"
    install:
      macos: https://docs.astral.sh/uv/getting-started/installation/
      windows: https://docs.astral.sh/uv/getting-started/installation/
      linux: https://docs.astral.sh/uv/getting-started/installation/
operations:
- validate
- estimate
inputs:
- name: choice_data
  media_types:
  - text/csv
  - application/vnd.apache.parquet
  required: true
outputs:
  artifacts:
    parameters:
      profile: parameters
      media_types:
      - text/csv
      required: false
    covariance:
      profile: table
      media_types:
      - text/csv
      required: false
    metrics:
      profile: metrics
      media_types:
      - application/json
      required: false
    predictions:
      profile: predictions
      media_types:
      - text/csv
      required: false
    sample_summary:
      profile: diagnostics
      media_types:
      - application/json
      required: true
  extensions: []
configuration:
  schema:
    "$schema": https://json-schema.org/draft/2020-12/schema
    "$id": https://davis.example/schemas/mnl-config-v1alpha1.json
    title: Davis MNL configuration
    type: object
    additionalProperties: false
    required:
    - roles
    - terms
    properties:
      roles:
        type: object
        additionalProperties: false
        required:
        - case_id
        - alternative_id
        oneOf:
        - required:
          - chosen
        - required:
          - chosen_alternative
        properties:
          case_id:
            oneOf:
            - type: string
            - type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
          alternative_id:
            type: string
          chosen:
            type: string
          chosen_alternative:
            type: string
          available:
            type: string
          weight:
            type: string
      terms:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - parameter
          properties:
            parameter:
              type: string
            column:
              type: string
            constant:
              type: number
            alternatives:
              type: array
              items:
                type:
                - string
                - number
          oneOf:
          - required:
            - column
          - required:
            - constant
      parameters:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            initial:
              type: number
      estimation:
        type: object
        additionalProperties: false
        properties:
          optimizer:
            enum:
            - bfgs
            - l-bfgs-b
          max_iterations:
            type: integer
            minimum: 1
          tolerance:
            type: number
            exclusiveMinimum: 0
          development_case_limit:
            type: integer
            minimum: 1
            description: 入力順の先頭Nケースだけを使う動作確認用設定です．本推定では省略してください．
            x-davis-description: {ja: 入力順の先頭Nケースだけを使う動作確認用設定です．本推定では省略してください．, en: Uses only the first N cases for a development check. Omit this setting for actual estimation.}
presentation:
  ui:
    version: davis.ui/v1
    component_name: {ja: Davis多項ロジット, en: Davis Multinomial Logit}
    inputs:
      choice_data:
        title: {ja: 選択データ, en: Choice data}
        description: {ja: 1行が1ケース内の1選択肢を表すlong形式の表です．複数CSVを結合できます．, en: A long-format table where each row represents one alternative in one choice case. Multiple CSV files can be joined.}
        widget: table-binding
        preparation: {component: davis/csv-transform, version: 0.4.0}
    sections:
    - bind: /roles
      widget: column-map
      input: choice_data
      title: {ja: 役割列, en: Role columns}
      labels:
        case_id: {ja: ケースキー, en: Case key}
        alternative_id: {ja: 選択肢ID, en: Alternative ID}
        chosen: {ja: 選択済みフラグ, en: Chosen flag}
        chosen_alternative: {ja: 選択された選択肢ID, en: Chosen alternative ID}
        available: {ja: 利用可能性 (任意), en: Availability (optional)}
        weight: {ja: 重み (任意), en: Weight (optional)}
    - bind: /terms
      widget: utility-terms
      input: choice_data
      title: {ja: 効用term, en: Utility terms}
      allow_constant: true
      alternatives_from: /roles/alternative_id
    - {bind: /parameters, widget: parameter-settings, parameters_from: /terms, title: {ja: Parameter設定, en: Parameter settings}}
    - {bind: /estimation, widget: auto, title: {ja: 推定設定, en: Estimation settings}}
    defaults:
      estimation: {optimizer: bfgs, max_iterations: 500, tolerance: 1.0e-8}
    results:
    - artifact: metrics
      title: {ja: 推定指標, en: Estimation metrics}
      widget: key-value
    - artifact: parameters
      title: {ja: 推定係数, en: Estimated parameters}
      widget: table
    - artifact: sample_summary
      title: {ja: 標本, en: Sample summary}
      widget: key-value
    - artifact: predictions
      title: {ja: 予測確率, en: Predicted probabilities}
      widget: table
