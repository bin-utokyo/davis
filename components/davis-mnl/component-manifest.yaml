api_version: davis.component/v1alpha1
id: davis/mnl
name: Davis Multinomial Logit
version: 0.1.0
kind: model
requires_davis: ">=0.3.5"

runtime:
  kind: python
  command: ["uv", "run", "--frozen", "python", "-m", "davis_mnl"]
  request_argument: "--request"
  lockfile: uv.lock

operations: [validate, estimate]

inputs:
  - name: choice_data
    media_types: [text/csv, application/vnd.apache.parquet]
    required: true

config_schema: schemas/config.schema.json
ui_schema: schemas/ui.schema.json

outputs:
  artifacts:
    parameters:
      media_types: [text/csv]
      required: false
    covariance:
      media_types: [text/csv]
      required: false
    metrics:
      media_types: [application/json]
      required: false
    predictions:
      media_types: [text/csv]
      required: false
    sample_summary:
      media_types: [application/json]
      required: true
  extensions: []
