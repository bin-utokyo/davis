openapi: 3.1.0
info:
  title: Davis Download API
  version: 1.0.0
  description: 招待codeとaccess groupを用いてprivate R2 Objectを取得するCLI・Web共通API
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { const: ok }
                  version: { const: 1 }
  /api/v1/version:
    get:
      operationId: getLatestVersion
      responses:
        "200":
          description: Current Davis CLI release information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseInfo" }
  /api/v1/auth/exchange:
    post:
      operationId: exchangeInviteCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code: { type: string }
                client: { type: string, enum: [web, cli], default: web }
      responses:
        "200":
          description: Session issued. Web clients receive an HttpOnly cookie; CLI clients receive token.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/session:
    get:
      operationId: getSession
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Browser session cookie removed
  /api/v1/admin/auth/exchange:
    post:
      operationId: exchangeAdminCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admin_code]
              properties:
                admin_code: { type: string }
      responses:
        "200":
          description: Short-lived Site Admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/admin/auth/session:
    get:
      operationId: getAdminSession
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current Site Admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/admin/access-groups:
    get:
      operationId: listAccessGroups
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Access groups and dataset grants }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAccessGroup
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id: { type: string }
      responses:
        "201":
          description: Paired participant and operator codes, returned once
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/dataset-access:
    put:
      operationId: updateDatasetAccess
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id, allowed_group_ids]
              properties:
                dataset_id: { type: string }
                allowed_group_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string }
      responses:
        "200": { description: Dataset access replaced }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/admin/storage/compress:
    post:
      operationId: compressStoredObject
      deprecated: true
      description: Legacy single-object migration endpoint. Current CLI versions compress locally and use the multipart upload endpoints.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oid, size]
              properties:
                oid: { type: string, pattern: '^blake3:[0-9a-f]{64}$' }
                size: { type: integer, minimum: 0 }
      responses:
        "200": { description: Losslessly compressed object after verification and raw-object removal }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/uploads/plan:
    post:
      operationId: planOperatorUploads
      description: Reports whether each content-addressed object already has a valid raw or gzip representation.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objects]
              properties:
                objects:
                  type: array
                  minItems: 1
                  maxItems: 512
                  items: { $ref: "#/components/schemas/ObjectRef" }
      responses:
        "200":
          description: Upload plan
          content:
            application/json:
              schema:
                type: object
                required: [objects]
                properties:
                  objects:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/ObjectRef" }
                        - type: object
                          required: [status]
                          properties:
                            status: { type: string, enum: [existing, missing] }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/uploads/create:
    post:
      operationId: createOperatorUpload
      description: Starts a multipart upload. Current clients send a locally compressed gzip representation; omitting storage_format is retained for legacy raw clients.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ObjectRef" }
                - type: object
                  properties:
                    storage_format: { type: string, const: davis.gzip/v1 }
                    replace_raw:
                      type: boolean
                      default: false
                      description: Site Admin only. Delete the matching raw representation after gzip is confirmed.
      responses:
        "200":
          description: Existing representation or new multipart upload coordinates
          content:
            application/json:
              schema:
                type: object
                required: [oid, size, already_present]
                properties:
                  oid: { type: string }
                  size: { type: integer, minimum: 0 }
                  already_present: { type: boolean }
                  upload_id: { type: string }
                  part_size: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/uploads/part:
    put:
      operationId: uploadOperatorPart
      description: Uploads one encoded multipart chunk. Every non-final R2 part must be at least 5 MiB.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: oid
          in: query
          required: true
          schema: { type: string, pattern: '^blake3:[0-9a-f]{64}$' }
        - name: upload_id
          in: query
          required: true
          schema: { type: string }
        - name: storage_format
          in: query
          required: false
          description: Current clients use davis.gzip/v1; omission identifies a legacy raw upload.
          schema: { type: string, const: davis.gzip/v1 }
        - name: part_number
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 10000 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Uploaded part receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedPart" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/operator/uploads/complete:
    post:
      operationId: completeOperatorUpload
      description: Commits an upload after verifying encoded byte count and gzip representation metadata.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ObjectRef" }
                - type: object
                  required: [upload_id, parts]
                  properties:
                    stored_size:
                      type: integer
                      minimum: 1
                      description: Encoded byte count. Required for davis.gzip/v1 and omitted by legacy raw clients.
                    storage_format:
                      type: string
                      const: davis.gzip/v1
                      description: Omitted by legacy raw clients.
                    replace_raw:
                      type: boolean
                      default: false
                    upload_id: { type: string }
                    parts:
                      type: array
                      minItems: 1
                      maxItems: 10000
                      items: { $ref: "#/components/schemas/UploadedPart" }
      responses:
        "200": { description: Upload committed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/uploads/abort:
    post:
      operationId: abortOperatorUpload
      description: Cancels an incomplete multipart upload.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oid, upload_id]
              properties:
                oid: { type: string, pattern: '^blake3:[0-9a-f]{64}$' }
                storage_format:
                  type: string
                  const: davis.gzip/v1
                  description: Omitted by legacy raw clients.
                upload_id: { type: string }
      responses:
        "200": { description: Upload aborted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operator/datasets/claim:
    post:
      operationId: claimOperatorDatasets
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_ids]
              properties:
                dataset_ids:
                  type: array
                  minItems: 1
                  maxItems: 512
                  uniqueItems: true
                  items: { type: string }
      responses:
        "200": { description: Previously unclaimed, unpublished datasets assigned to the operator access group }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/download-grants:
    post:
      operationId: createDownloadGrants
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  minItems: 1
                  maxItems: 256
                  uniqueItems: true
                  items: { type: string }
      responses:
        "200":
          description: Short-lived download URLs
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/DownloadGrant" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/download:
    get:
      operationId: downloadObject
      parameters:
        - name: grant
          in: query
          required: true
          schema: { type: string }
        - name: Range
          in: header
          required: false
          description: Supported for legacy raw objects only. Gzip representations are returned as complete decoded files.
          schema: { type: string }
      responses:
        "200":
          description: Complete file. A stored gzip representation is streamed with Content-Encoding gzip and decoded by the client.
          headers:
            Content-Encoding:
              description: gzip when R2 stores a davis.gzip/v1 representation; omitted for legacy raw objects.
              schema: { type: string, const: gzip }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Requested byte range from a legacy raw representation
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: davis_session
  schemas:
    ObjectRef:
      type: object
      required: [oid, size]
      properties:
        oid: { type: string, pattern: '^blake3:[0-9a-f]{64}$' }
        size:
          type: integer
          minimum: 0
          description: Uncompressed object size recorded in the Davis Manifest.
    UploadedPart:
      type: object
      required: [part_number, etag, size]
      properties:
        part_number: { type: integer, minimum: 1, maximum: 10000 }
        etag: { type: string }
        size: { type: integer, minimum: 1 }
    ReleaseInfo:
      type: object
      required: [schema_version, latest, minimum_supported, released_at, release_url, message]
      properties:
        schema_version: { const: 1 }
        latest: { type: string }
        minimum_supported: { type: string }
        released_at: { type: string, format: date }
        release_url: { type: string, format: uri }
        message:
          type: object
          required: [ja, en]
          properties:
            ja: { type: string }
            en: { type: string }
    Session:
      type: object
      required: [authenticated, access_revision, expires_at]
      properties:
        authenticated: { const: true }
        access_revision: { type: string }
        expires_at: { type: string, format: date-time }
        role: { type: string, enum: [operator, admin] }
        group_id: { type: string }
        token:
          type: string
          description: CLI client requests only
    DownloadGrant:
      type: object
      required: [file_id, path, size, expires_at, url]
      properties:
        file_id: { type: string }
        path: { type: string }
        size: { type: integer, minimum: 0 }
        expires_at: { type: string, format: date-time }
        url: { type: string, format: uri }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
